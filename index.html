<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留言板 | Guestbook</title>
<meta name="description" content="留下你的足跡,與大家分享想法。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --text:#0f172a; --muted:#64748b; --line:#e5e7eb;
    --brand:#10b981; --brand-d:#059669; --brand-soft:#ecfdf5; --danger:#dc2626;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0f14; --surface:#131a22; --text:#e8edf3; --muted:#8a97a8; --line:#222c37;
      --brand-soft:#0f2a22; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .hero{background:linear-gradient(135deg,#064e3b,#10b981);color:#fff;padding:56px 16px 96px;text-align:center}
  .hero h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.02em}
  .hero p{margin:0;opacity:.9}
  .stat{display:inline-flex;gap:6px;align-items:center;margin-top:16px;padding:4px 14px;
    background:rgba(255,255,255,.18);border-radius:999px;font-size:.85rem;backdrop-filter:blur(4px)}
  main{max-width:680px;margin:-64px auto 48px;padding:0 16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  form{padding:20px}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
  input,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--text);font:inherit;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(16,185,129,.2);background:var(--surface)}
  textarea{resize:vertical;min-height:96px}
  .field{margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .count{font-size:.8rem;color:var(--muted)}
  .count.warn{color:var(--danger)}
  button{background:var(--brand);color:#fff;border:0;padding:11px 24px;border-radius:10px;
    font:inherit;font-weight:600;cursor:pointer;transition:background .15s,transform .05s}
  button:hover{background:var(--brand-d)}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .hp{position:absolute;left:-9999px;opacity:0}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 4px 12px;font-weight:700}
  .section-title small{color:var(--muted);font-weight:400}
  .msg{padding:16px 18px;margin-bottom:12px;display:flex;gap:14px;animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:1.05rem}
  .body{min-width:0;flex:1}
  .head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  .name{font-weight:600}
  time{font-size:.8rem;color:var(--muted)}
  .text{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty b{display:block;font-size:2rem;margin-bottom:4px}
  .sk{height:84px;margin-bottom:12px;border-radius:16px;
    background:linear-gradient(90deg,var(--line) 25%,transparent 50%,var(--line) 75%);
    background-size:200% 100%;animation:sh 1.4s infinite;opacity:.5}
  @keyframes sh{to{background-position:-200% 0}}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111827;color:#fff;
    padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;font-size:.9rem;z-index:9}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{background:var(--danger)}
  #more{display:block;margin:8px auto 0;background:transparent;color:var(--brand-d);border:1px solid var(--line)}
  #more:hover{background:var(--brand-soft)}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:32px}
  @media (max-width:480px){.msg{padding:14px}.avatar{width:36px;height:36px}}
</style>
</head>
<body>
<header class="hero">
  <h1>📝 留言板</h1>
  <p>留下你的足跡,與大家分享想法</p>
  <div class="stat"><span id="total">–</span> 則留言</div>
</header>

<main>
  <form id="form" class="card" autocomplete="off">
    <div class="field">
      <label for="name">暱稱</label>
      <input id="name" maxlength="30" placeholder="怎麼稱呼你?" required>
    </div>
    <div class="field">
      <label for="content">留言內容</label>
      <textarea id="content" maxlength="500" placeholder="寫點什麼吧…" required></textarea>
    </div>
    <input class="hp" id="website" tabindex="-1" aria-hidden="true">
    <div class="row">
      <span class="count" id="count">0 / 500</span>
      <button id="btn" type="submit">送出留言</button>
    </div>
  </form>

  <div class="section-title">最新留言 <small id="sync"></small></div>
  <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <button id="more" hidden>載入更多</button>
</main>

<footer>Powered by Supabase · GitHub Pages</footer>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://yhdqsqnbjqznrjcpoeei.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_rVeSI1olnmwCet3IIwgMOg_NInzHB0l';
  const PAGE = 20, COOLDOWN_MS = 15000;

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);
  let rows = [], total = 0, lastSent = 0;

  try { $('name').value = localStorage.getItem('gb_name') || ''; } catch {}

  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2800);
  }

  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 60) return '剛剛';
    if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小時前';
    if (s < 86400 * 7) return Math.floor(s / 86400) + ' 天前';
    return new Date(iso).toLocaleDateString('zh-TW');
  }

  function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

  function render() {
    const list = $('list'); list.replaceChildren();
    if (!rows.length) {
      const e = document.createElement('div'); e.className = 'empty card';
      e.innerHTML = '<b>💬</b>還沒有留言,來搶頭香吧!';
      list.append(e);
    }
    for (const m of rows) {
      const el = document.createElement('article'); el.className = 'msg card';
      const av = document.createElement('div'); av.className = 'avatar';
      av.textContent = [...m.name][0].toUpperCase();
      av.style.background = `hsl(${hue(m.name)} 55% 45%)`;
      const body = document.createElement('div'); body.className = 'body';
      const head = document.createElement('div'); head.className = 'head';
      const n = document.createElement('span'); n.className = 'name'; n.textContent = m.name;
      const t = document.createElement('time'); t.dateTime = m.created_at;
      t.textContent = ago(m.created_at); t.title = new Date(m.created_at).toLocaleString('zh-TW');
      head.append(n, t);
      const p = document.createElement('p'); p.className = 'text'; p.textContent = m.content; // 避免 XSS
      body.append(head, p); el.append(av, body); list.append(el);
    }
    $('total').textContent = total;
    $('more').hidden = rows.length >= total;
  }

  async function load(reset = true) {
    const from = reset ? 0 : rows.length;
    const { data, error, count } = await db.from('messages')
      .select('*', { count: 'exact' }).order('created_at', { ascending: false }).range(from, from + PAGE - 1);
    if (error) { $('list').replaceChildren(); toast('讀取失敗:' + error.message, true); return; }
    rows = reset ? data : rows.concat(data); total = count ?? rows.length; render();
  }

  $('content').addEventListener('input', e => {
    const n = e.target.value.length; $('count').textContent = `${n} / 500`;
    $('count').classList.toggle('warn', n > 450);
  });

  $('more').addEventListener('click', () => load(false));

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    if ($('website').value) return; // 機器人陷阱
    const wait = COOLDOWN_MS - (Date.now() - lastSent);
    if (wait > 0) { toast(`請稍候 ${Math.ceil(wait / 1000)} 秒再送出`, true); return; }
    const name = $('name').value.trim(), content = $('content').value.trim();
    if (!name || !content) return;
    $('btn').disabled = true; $('btn').textContent = '送出中…';
    const { error } = await db.from('messages').insert({ name, content });
    $('btn').disabled = false; $('btn').textContent = '送出留言';
    if (error) { toast('送出失敗:' + error.message, true); return; }
    try { localStorage.setItem('gb_name', name); } catch {}
    lastSent = Date.now(); $('content').value = ''; $('count').textContent = '0 / 500';
    toast('✅ 留言已送出'); load();
  });

  db.channel('messages').on('postgres_changes',
    { event: 'INSERT', schema: 'public', table: 'messages' }, () => load()).subscribe();

  setInterval(() => document.querySelectorAll('time').forEach((t, i) => { if (rows[i]) t.textContent = ago(rows[i].created_at); }), 30000);
  load();
</script>
</body>
</html>
